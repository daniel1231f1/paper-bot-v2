name: paper-bot
# PAPER TRADING ONLY. Runs the bot in ~5.5h sessions, back to back: each job queues the next one
# when it ends, so the bot keeps going even if GitHub's cron never fires. Triggers arriving while a
# session is running queue behind it (one pending run at most): always exactly one writer of the state.
on:
  schedule:
    - cron: "7,37 * * * *"   # UTC. Backup only: restarts the chain if a job was lost.
  push:                      # a deploy starts (or queues) a run straight away
    branches: [main]
    paths: ["bot/**", "config.yaml", "dashboard/**", "scripts/**", "requirements.txt", ".github/workflows/paper-bot.yml"]
  workflow_dispatch:
    inputs:
      reset_experiment:
        description: "Type RESET to archive the current run and start a NEW 10-day experiment"
        required: false
        default: ""
permissions:
  contents: write
  actions: write   # lets a finishing job queue the next one (workflow_dispatch)
concurrency:
  group: paper-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PUBLISH: "1"
      RUN_SECONDS: "19800"
      STATE_DIR: state
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Restore candle + model cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: bot-cache-${{ github.run_id }}
          restore-keys: bot-cache-
      - name: Restore state
        run: bash scripts/restore_state.sh
      - name: Reset experiment (manual, explicit)
        if: github.event_name == 'workflow_dispatch' && inputs.reset_experiment == 'RESET'
        run: bash scripts/reset_experiment.sh
      - name: Run bot
        run: |
          # refresh the Outlook tab's data every hour while this job is alive (a background loop here,
          # so the trading code is untouched and no extra runner is used)
          (while sleep 3600; do gh workflow run outlook.yml --ref "$GITHUB_REF_NAME" || true; done) &
          python -m bot.cli run
      - name: Publish final state
        if: always()
        run: bash scripts/publish_state.sh || true
      - name: Queue the next session
        # GitHub's cron can be hours late or never fire on some repositories, so the bot does not
        # depend on it: every job queues its successor here. The concurrency group keeps exactly
        # one job running; the queued one starts the moment this one ends.
        if: always()
        run: |
          if [ -f "$STATE_DIR/.stop_chain" ]; then echo "experiment complete: not queuing another session"; exit 0; fi
          if [ "${{ job.status }}" != "success" ]; then echo "this job did not succeed: pausing 10 minutes before queuing the next"; sleep 600; fi
          gh workflow run paper-bot.yml --ref "$GITHUB_REF_NAME" && echo "queued the next session"
          gh workflow run outlook.yml --ref "$GITHUB_REF_NAME" && echo "queued an outlook refresh" || true
      - name: Save candle + model cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: bot-cache-${{ github.run_id }}
