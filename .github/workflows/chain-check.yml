name: chain-check
# One-off proof that a job's built-in token is allowed to queue another workflow run, which is
# what the bot relies on to keep itself going without GitHub's cron. Safe to delete afterwards.
on:
  push:
    branches: [main]
    paths: [".github/workflows/chain-check.yml"]
permissions:
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - run: gh workflow run outlook.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" && echo "queued outlook via workflow_dispatch"
