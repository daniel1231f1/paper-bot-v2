name: keepalive
# GitHub disables scheduled workflows in repositories with no activity for 60 days.
# Re-enabling them through the API once a week keeps the schedule alive.
on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  actions: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in paper-bot.yml outlook.yml keepalive.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable" && echo "kept ${wf} alive"
          done
